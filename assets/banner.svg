<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220">
<defs>
 <clipPath id="clip"><rect width="900" height="220" rx="18"/></clipPath>
 <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#080708"/><stop offset=".55" stop-color="#1a0c10"/><stop offset="1" stop-color="#260b10"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#3a141c"/><stop offset=".5" stop-color="#6a2029"/><stop offset="1" stop-color="#3a141c"/></linearGradient>
 <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#b28a8a" opacity=".12"/><circle cx="5" cy="4" r=".4" fill="#b28a8a" opacity=".08"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<style>
 @keyframes slowglow{0%,100%{opacity:.18}50%{opacity:.38}}
 @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.7}}
 .sigil{animation:slowglow 5s ease-in-out infinite}.star{animation:twinkle 3s ease-in-out infinite}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="220" fill="url(#bg)"/>
<rect width="900" height="220" fill="url(#grain)"/>
<!-- understated medieval ornamental frame -->
<rect x="12" y="12" width="876" height="196" rx="12" fill="none" stroke="#49202a" stroke-width="2"/>
<rect x="19" y="19" width="862" height="182" rx="9" fill="none" stroke="#30161c" stroke-width="1"/>
<g fill="none" stroke="url(#edge)" stroke-width="2">
 <path d="M28 54V28H54 M846 28h26v26 M28 166v26h26 M846 192h26v-26"/>
 <path d="M42 28l12 12-12 12-12-12Z M858 28l12 12-12 12-12-12Z M42 168l12 12-12 12-12-12Z M858 168l12 12-12 12-12-12Z"/>
 <path d="M35 110h20 M845 110h20"/>
</g>
<!-- faint gothic arch/sigil on right -->
<g class="sigil" fill="none" stroke="#5c2029" stroke-width="2">
 <path d="M680 183V90Q680 43 735 34Q790 43 790 90V183"/>
 <path d="M700 183V96Q700 60 735 51Q770 60 770 96V183"/>
 <path d="M735 55V183M694 118h82M705 90l30 28 30-28"/>
 <circle cx="735" cy="118" r="50"/>
</g>
<g fill="#6d3139" class="star"><path d="M735 29l4 10-4 10-4-10Z"/><path d="M668 110l4 8-4 8-4-8Z"/><path d="M804 110l4 8-4 8-4-8Z"/></g>
<text x="58" y="88" font-family="serif" font-size="43" fill="#c4b5b3" letter-spacing="1">Emmanuel S. Kachasu</text>
<path d="M60 101H620" stroke="#51212a" stroke-width="2"/>
<text x="62" y="130" font-family="monospace" font-size="14" letter-spacing="4" fill="#a58b8b">SOFTWARE DEVELOPER</text>
<text x="62" y="153" font-family="monospace" font-size="14" letter-spacing="4" fill="#8d7378">IT STUDENT</text>
<text x="62" y="183" font-family="monospace" font-size="14" fill="#9b5b65">&gt; build. learn. improve. repeat.</text>
<!-- ornamental divider -->
<path d="M600 190h55m-55-4v8m55-4l10-5-10 10" stroke="#50212b" fill="none"/>
</g></svg>